<article class="dashboard-card flex min-h-16 items-center gap-3">
    <div class="dashboard-card-icon">
        {{ icon }}
    </div>

    <div class="min-w-0">
        <p class="dashboard-card-label">
            {{ label }}
        </p>

        <p class="dashboard-card-value truncate">
            {{ value }}
        </p>
    </div>
</article>
