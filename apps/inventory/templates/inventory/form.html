{% extends "layouts/app_shell.html" %}{% block title %}{{ title }} | Liberia EHR{% endblock %}{% block workspace %}<div class="mx-auto max-w-4xl p-5 lg:p-7"><h1 class="mb-1 text-2xl font-bold">{{ title }}</h1><p class="mb-5 text-sm text-slate-500">Complete all relevant traceability fields before posting.</p><form method="post" class="rounded-xl border bg-white p-5">{% csrf_token %}{{ form.non_field_errors }}<div class="grid gap-4 md:grid-cols-2">{% for field in form %}<label class="block"><span class="text-xs font-bold">{{ field.label }}</span>{{ field }}{% for error in field.errors %}<span class="block text-xs text-red-700">{{ error }}</span>{% endfor %}</label>{% endfor %}</div><div class="mt-6 flex justify-end gap-2"><a href="{% url 'inventory:dashboard' %}" class="rounded-md border px-4 py-2 text-sm font-semibold">Cancel</a><button class="rounded-md bg-emerald-700 px-5 py-2 text-sm font-semibold text-white">{{ submit_label }}</button></div></form></div>{% endblock %}
