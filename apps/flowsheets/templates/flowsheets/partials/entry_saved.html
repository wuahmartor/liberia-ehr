<section id="inline-flow-form" class="w-full max-w-5xl py-2 pr-3">
    <div class="rounded-lg border border-emerald-200 bg-emerald-50 p-5 text-center shadow-sm">
        <p class="text-xs font-bold text-emerald-900">Assessment signed</p>
        <p class="mt-1 text-[10px] text-emerald-700">{{ entry.get_assessment_type_display }} was recorded at {{ entry.recorded_at|time:"H:i" }}.</p>
        <div class="mt-3 flex justify-center gap-2">
            <a href="{{ entry.get_absolute_url }}" class="rounded border border-emerald-300 bg-white px-3 py-1.5 text-[10px] font-semibold text-emerald-800">View entry</a>
            <a href="{% url 'flowsheets:patient-definition' patient.pk definition.slug %}{% if active_encounter %}?encounter={{ active_encounter.pk }}{% endif %}" hx-get="{% url 'flowsheets:patient-definition' patient.pk definition.slug %}{% if active_encounter %}?encounter={{ active_encounter.pk }}{% endif %}" hx-target="#flowsheet-tabs-workspace" hx-select="#flowsheet-tabs-workspace" hx-swap="outerHTML" class="rounded bg-emerald-700 px-3 py-1.5 text-[10px] font-bold text-white">Return to flowsheet</a>
        </div>
    </div>
</section>
