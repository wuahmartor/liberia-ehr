
<div class="rounded-lg border border-red-200 bg-white p-4">
    <h2 class="text-base font-semibold text-red-700">
        Delete {{ kind|title }}
    </h2>

    <p class="mt-2 text-sm text-slate-600">
        Are you sure you want to delete this record?
    </p>

    <p class="mt-1 text-xs text-slate-500">
        {{ record }}
    </p>

    <form
        method="post"
        hx-post="{% url 'patients:child-delete' patient.id kind record.id %}"
        hx-target="#modal-content"
        class="mt-4 flex justify-end gap-2"
    >
        {% csrf_token %}

        <button
            type="button"
            class="rounded-md border border-slate-300 px-3 py-2 text-xs font-semibold"
            @click="open = false"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="rounded-md bg-red-600 px-3 py-2 text-xs font-semibold text-white"
        >
            Delete
        </button>
    </form>
</div>
