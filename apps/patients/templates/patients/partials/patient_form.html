<form
    method="post"
    class="space-y-4"
    {% if object %}
        hx-post="{% url 'patients:update' object.id %}"
    {% else %}
        hx-post="{% url 'patients:create' %}"
    {% endif %}
    hx-target="#modal-content"
    hx-swap="innerHTML"
>
    {% csrf_token %}

    {% include "patients/partials/form_fields.html" %}

    <div class="flex justify-end gap-2 border-t border-slate-200 pt-4">
        <button
            type="button"
            class="rounded-md border border-slate-300 px-3 py-2 text-xs font-semibold text-slate-700"
            @click="open = false"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="rounded-md bg-ehr-800 px-3 py-2 text-xs font-semibold text-white hover:bg-ehr-900"
        >
            Save Patient
        </button>
    </div>
</form>
