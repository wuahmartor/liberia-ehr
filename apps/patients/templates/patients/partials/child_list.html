

<div class="rounded-lg border border-slate-200 bg-white shadow-sm">
    <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
        <div>
            <h3 class="text-sm font-semibold text-slate-900">
                {{ model_name|title }}
            </h3>
        </div>

        <button
            type="button"
            class="rounded-md bg-ehr-800 px-3 py-1.5 text-xs font-semibold text-white"
            hx-get="{% url 'patients:child-create' patient.id kind %}"
            hx-target="#modal-content"
        >
            Add
        </button>
    </div>

    {% if records %}
        <div class="divide-y divide-slate-100">
            {% for record in records %}
                <div class="flex items-center justify-between gap-3 px-4 py-3">
                    <div class="min-w-0">
                        <p class="truncate text-sm font-medium text-slate-900">
                            {{ record }}
                        </p>

                        {% if record.updated_at %}
                            <p class="text-xs text-slate-500">
                                Updated {{ record.updated_at|date:"M j, Y g:i A" }}
                            </p>
                        {% endif %}
                    </div>

                    <div class="flex gap-2">
                        <button
                            type="button"
                            class="text-xs font-semibold text-ehr-700"
                            hx-get="{% url 'patients:child-update' patient.id kind record.id %}"
                            hx-target="#modal-content"
                        >
                            Edit
                        </button>

                        <button
                            type="button"
                            class="text-xs font-semibold text-red-600"
                            hx-get="{% url 'patients:child-delete' patient.id kind record.id %}"
                            hx-target="#modal-content"
                        >
                            Delete
                        </button>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="px-4 py-6 text-center text-xs text-slate-500">
            No records available.
        </div>
    {% endif %}
</div>
