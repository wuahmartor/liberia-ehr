

{% extends "layouts/app_shell.html" %}

{% block title %}
    Patient Record | Liberia EHR
{% endblock %}

{% block workspace %}
<section class="mx-auto max-w-3xl">
    <div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
        <h1 class="text-lg font-semibold text-ehr-950">
            {{ kind|title }}
        </h1>

        <p class="mt-1 text-xs text-slate-500">
            Patient: {{ patient.full_name }}
        </p>

        <div class="mt-5">
            {% include "patients/partials/child_form.html" %}
        </div>
    </div>
</section>
{% endblock %}
