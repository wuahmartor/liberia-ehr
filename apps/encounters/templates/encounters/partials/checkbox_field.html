

{% comment %}
============================================================
ENCOUNTER CHECKBOX FIELD
============================================================
{% endcomment %}

<div
    class="
        rounded-lg border border-slate-200
        bg-slate-50 p-3
    "
>
    <label
        for="{{ field.id_for_label }}"
        class="
            flex cursor-pointer
            items-start gap-3
        "
    >
        <span class="pt-0.5">
            {{ field }}
        </span>

        <span>
            <span
                class="
                    block text-sm font-medium
                    text-slate-800
                "
            >
                {{ field.label }}
            </span>

            {% if field.help_text %}
                <span
                    class="
                        mt-0.5 block text-xs
                        leading-5 text-slate-500
                    "
                >
                    {{ field.help_text }}
                </span>
            {% endif %}
        </span>
    </label>

    {% for error in field.errors %}
        <p
            class="
                mt-2 text-xs font-medium
                text-red-600
            "
            role="alert"
        >
            {{ error }}
        </p>
    {% endfor %}
</div>
