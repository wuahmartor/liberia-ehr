{% extends "layouts/app_shell.html" %}

{% block title %}
Medication Administration | Liberia EHR
{% endblock %}


{% block workspace %}

<section
    class="
        h-full
        overflow-y-auto
        bg-slate-50
        p-4
    "
>

    <div
        x-data="{
            status: '{{ form.status.value|default:"administered" }}'
        }"

        class="
            mx-auto max-w-xl
            overflow-hidden
            rounded-lg
            border border-slate-200
            bg-white
        "
    >

        <header
            class="
                border-b border-slate-200
                px-4 py-3
            "
        >

            <h1 class="text-sm font-semibold text-slate-900">
                Medication Administration
            </h1>

        </header>


        <form
            method="post"
            action="{{ request.path }}"
            class="p-4"
            hx-boost="true"
        >

            {% csrf_token %}

            {% include "medications/partials/form_fields.html" %}


            <div
                class="
                    mt-5
                    flex justify-end
                    gap-2
                "
            >

                <button
                    type="submit"
                    class="
                        rounded-md
                        bg-emerald-700
                        px-4 py-2
                        text-xs font-semibold
                        text-white
                    "
                >
                    Save
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock workspace %}
