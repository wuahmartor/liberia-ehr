{% if query|length >= 2 %}<div class="absolute z-30 mt-1 max-h-72 w-full overflow-y-auto rounded border border-slate-300 bg-white shadow-xl">{% for code in results %}<button type="button" class="flex w-full gap-3 border-b px-3 py-2 text-left hover:bg-blue-50" onclick="document.getElementById('id_procedure_code').value='{{ code.pk }}'; this.closest('form').querySelector('[name=procedure_query]').value='{{ code.code|escapejs }} — {{ code.title|escapejs }}'; document.getElementById('cpt-results').innerHTML='';"><strong class="w-16 font-mono text-blue-800">{{ code.code }}</strong><span><b>{{ code.title }}</b><small class="block text-[9px] text-slate-500">{{ code.source }}</small></span></button>{% empty %}<p class="p-3 text-slate-500">No licensed CPT match. An administrator must import an AMA-authorized CPT data file.</p>{% endfor %}</div>{% endif %}
