{% if query|length >= 2 %}<div class="absolute z-40 mt-1 max-h-56 w-full overflow-y-auto rounded border border-slate-300 bg-white shadow-xl">{% for code in results %}<button type="button" class="flex w-full gap-2 border-b px-2 py-1.5 text-left hover:bg-violet-50" onclick="document.getElementById('id_new_procedure_code').value='{{ code.pk }}'; document.getElementById('note-cpt-selection').textContent='Selected: {{ code.code|escapejs }} — {{ code.title|escapejs }}'; document.getElementById('note-cpt-results').innerHTML='';"><strong class="w-14 shrink-0 font-mono text-violet-800">{{ code.code }}</strong><span>{{ code.title }}</span></button>{% empty %}<p class="p-2 text-slate-500">No licensed CPT match. Ask an administrator to load the authorized CPT file.</p>{% endfor %}</div>{% endif %}
