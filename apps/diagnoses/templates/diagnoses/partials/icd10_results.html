{% if query|length >= 2 %}<div class="absolute z-30 mt-1 max-h-72 w-full overflow-y-auto rounded-md border border-slate-300 bg-white shadow-xl">{% for concept in results %}<button type="button" class="flex w-full items-start gap-3 border-b border-slate-100 px-3 py-2 text-left hover:bg-blue-50" onclick="document.getElementById('id_concept').value='{{ concept.pk }}'; this.closest('[x-data]').querySelector('[name=concept_query]').value='{{ concept.code|escapejs }} — {{ concept.title|escapejs }}'; document.getElementById('icd10-results').innerHTML='';"><strong class="w-20 shrink-0 font-mono text-blue-800">{{ concept.code }}</strong><span><b class="text-slate-900">{{ concept.title }}</b><small class="block text-[9px] text-slate-500">{{ concept.source }}{% if concept.is_billable %} · reportable code{% endif %}</small></span></button>{% empty %}<p class="p-3 text-slate-500">No local ICD-10-CM match. Ask an administrator to load the current release.</p>{% endfor %}</div>{% endif %}
