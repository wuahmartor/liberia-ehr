{% if query|length >= 2 %}<div class="absolute z-40 mt-1 max-h-56 w-full overflow-y-auto rounded border border-slate-300 bg-white shadow-xl">{% for concept in results %}<button type="button" class="flex w-full gap-2 border-b px-2 py-1.5 text-left hover:bg-blue-50" onclick="document.getElementById('id_new_diagnosis_concept').value='{{ concept.pk }}'; document.getElementById('note-icd-selection').textContent='Selected: {{ concept.code|escapejs }} — {{ concept.title|escapejs }}'; document.getElementById('note-icd-results').innerHTML='';"><strong class="w-16 shrink-0 font-mono text-blue-800">{{ concept.code }}</strong><span>{{ concept.title }}</span></button>{% empty %}<p class="p-2 text-slate-500">No ICD-10-CM match.</p>{% endfor %}</div>{% endif %}
