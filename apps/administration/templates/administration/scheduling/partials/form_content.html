


<div class="mx-auto max-w-7xl p-3">
    <form
        method="post"
        action="{{ request.path }}"
        hx-post="{{ request.path }}"
        hx-target="#scheduling-form-workspace"
        hx-swap="innerHTML"
        hx-disabled-elt="#appointment-submit-button"
        class="
            overflow-hidden rounded-xl
            border border-slate-200
            bg-white shadow-sm
        "
    >
        {% csrf_token %}

        <header
            class="
                border-b border-slate-200
                bg-slate-50 px-4 py-3
            "
        >
            <h1 class="text-base font-semibold text-slate-900">
                {{ page_title }}
            </h1>

            <p class="mt-0.5 text-xs text-slate-500">
                {{ page_description }}
            </p>
        </header>

        <div class="p-4">
            {% include "administration/scheduling/partials/form_fields.html" %}
        </div>

        <footer
            class="
                flex flex-wrap items-center
                justify-end gap-2
                border-t border-slate-200
                bg-slate-50 px-4 py-3
            "
        >
            {% if appointment %}
                <a
                    href="{% url 'administration:scheduling_detail' appointment_id=appointment.pk %}"
                    hx-boost="false"
                    class="
                        inline-flex items-center justify-center
                        rounded-md border border-slate-300
                        !bg-white px-3 py-2
                        text-xs font-semibold
                        !text-slate-700 shadow-sm
                        transition hover:!bg-slate-100
                    "
                >
                    Cancel
                </a>
            {% else %}
                <a
                    href="{% url 'administration:scheduling' %}"
                    hx-boost="false"
                    class="
                        inline-flex items-center justify-center
                        rounded-md border border-slate-300
                        !bg-white px-3 py-2
                        text-xs font-semibold
                        !text-slate-700 shadow-sm
                        transition hover:!bg-slate-100
                    "
                >
                    Cancel
                </a>
            {% endif %}

            <button
                id="appointment-submit-button"
                type="submit"
                class="
                    inline-flex shrink-0
                    items-center justify-center gap-2
                    rounded-md
                    border border-emerald-800
                    !bg-emerald-700
                    px-4 py-2
                    text-xs font-semibold
                    !text-white shadow-sm
                    transition
                    hover:!bg-emerald-800
                    focus:outline-none
                    focus:ring-2
                    focus:ring-emerald-500
                    focus:ring-offset-2
                    disabled:cursor-wait
                    disabled:opacity-60
                "
            >
                <svg
                    class="h-4 w-4 shrink-0"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M5 12.75 9.25 17 19 7.25"
                    />
                </svg>

                <span>
                    {{ submit_label|default:"Schedule Appointment" }}
                </span>
            </button>
        </footer>
    </form>
</div>
