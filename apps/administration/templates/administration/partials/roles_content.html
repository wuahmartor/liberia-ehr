<section id="roles-permissions-content" class="space-y-3">{% include "administration/partials/workspace_header.html" %}<div class="flex justify-end"><a href="{% url 'administration:role_create' %}" class="rounded bg-ehr-700 px-3 py-2 text-xs font-bold text-white">＋ Create role</a></div><div class="divide-y rounded-lg border bg-white">{% for group in role_groups %}<a href="{% url 'administration:role_update' group.pk %}" class="grid grid-cols-[1fr_auto] px-3 py-2 text-xs hover:bg-slate-50"><span class="font-bold">{{ group.name }}</span><span>{{ group.permissions.count }} permissions</span></a>{% empty %}<p class="p-5 text-center text-xs text-slate-500">No Django groups configured.</p>{% endfor %}</div></section>
