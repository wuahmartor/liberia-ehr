<section class="space-y-3">{% include "administration/partials/workspace_header.html" %}<div class="flex justify-end"><a href="{% url 'administration:configuration_create' 'dictionary' %}" class="rounded bg-ehr-700 px-3 py-2 text-xs font-bold text-white">＋ Add dictionary entry</a></div><div class="divide-y rounded-lg border bg-white">{% for item in dictionary_entries %}<a href="{% url 'administration:configuration_update' 'dictionary' item.pk %}" class="grid grid-cols-[10rem_8rem_1fr_5rem] px-3 py-2 text-[10px]"><strong>{{ item.dictionary }}</strong><span>{{ item.code }}</span><span>{{ item.display }}</span><span>{% if item.is_active %}Active{% else %}Inactive{% endif %}</span></a>{% empty %}<p class="p-5 text-center text-xs text-slate-500">No configurable dictionary entries.</p>{% endfor %}</div></section>
