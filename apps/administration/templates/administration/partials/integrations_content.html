<section class="space-y-3">{% include "administration/partials/workspace_header.html" %}<div class="flex justify-end"><a href="{% url 'administration:configuration_create' 'integration' %}" class="rounded bg-ehr-700 px-3 py-2 text-xs font-bold text-white">＋ Add integration</a></div><div class="grid gap-2 md:grid-cols-2">{% for item in integrations %}<a href="{% url 'administration:configuration_update' 'integration' item.pk %}" class="rounded-lg border bg-white p-3"><div class="flex justify-between"><strong class="text-xs">{{ item.name }}</strong><span class="text-[10px]">{{ item.get_status_display }}</span></div><p class="mt-1 text-[10px] text-slate-500">{{ item.integration_type }} · {{ item.base_url|default:"No endpoint" }}</p></a>{% empty %}<p class="rounded border bg-white p-5 text-center text-xs text-slate-500">No integrations configured.</p>{% endfor %}</div></section>
