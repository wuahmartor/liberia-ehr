{% extends "administration/base.html" %}{% block administration_content %}<form method="post" class="ehr-form-workspace ehr-form-workspace-small space-y-3 rounded-lg border bg-white p-3">{% csrf_token %}<h2 class="text-sm font-bold">Set temporary password for {{ managed_user.username }}</h2>{% for field in form %}<label class="block"><span class="mb-1 block text-[10px] font-bold">{{ field.label }}</span>{{ field }}{% for error in field.errors %}<span class="text-[9px] text-red-600">{{ error }}</span>{% endfor %}</label>{% endfor %}<button class="rounded bg-ehr-700 px-3 py-2 text-xs font-bold text-white">Set temporary password</button></form>{% endblock %}
