{% extends "administration/base.html" %}{% block administration_content %}<form method="post" class="space-y-3 rounded-lg border bg-white p-3">{% csrf_token %}{% for field in form %}<label class="block"><span class="mb-1 block text-[10px] font-bold">{{ field.label }}</span>{{ field }}{% for error in field.errors %}<span class="text-red-600">{{ error }}</span>{% endfor %}</label>{% endfor %}<p class="text-[9px] text-amber-700">Permissions take effect immediately. Assign the minimum access required.</p><button class="rounded bg-ehr-700 px-3 py-2 text-xs font-bold text-white">Save role permissions</button></form>{% endblock %}
