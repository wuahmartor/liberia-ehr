{% extends "administration/base.html" %}{% block administration_content %}<form method="post" class="grid gap-3 rounded-lg border bg-white p-3 sm:grid-cols-2">{% csrf_token %}{% for field in form %}<label class="block"><span class="mb-1 block text-[10px] font-bold text-slate-700">{{ field.label }}</span>{{ field }}{% if field.help_text %}<span class="mt-1 block text-[9px] text-slate-500">{{ field.help_text }}</span>{% endif %}{% for error in field.errors %}<span class="block text-[9px] text-red-600">{{ error }}</span>{% endfor %}</label>{% endfor %}<div class="flex justify-end gap-2 sm:col-span-2"><a href="{% url 'administration:users' %}" class="rounded border px-3 py-2 text-xs font-bold">Cancel</a><button class="rounded bg-ehr-700 px-3 py-2 text-xs font-bold text-white">Save user</button></div></form>{% endblock %}
