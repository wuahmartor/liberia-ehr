

{% comment %}
============================================================
ANALYTICS FILTER BAR

Updates #analytics-workspace using HTMX.
============================================================
{% endcomment %}


<form
    id="analytics-filter-form"
    method="get"
    action="{{ request.path }}"
    hx-get="{{ request.path }}"
    hx-target="#analytics-workspace"
    hx-swap="innerHTML"
    hx-push-url="true"
    hx-trigger="
        change from:select,
        change from:input[type='date']
    "
    hx-indicator="#analytics-loading-indicator"
    class="
        rounded-xl border border-slate-200
        bg-white p-3 shadow-sm
    "
>
    <div
        class="
            grid gap-3
            sm:grid-cols-2
            xl:grid-cols-5
        "
    >
        <!-- Start date -->
        <div>
            <label
                for="analytics-start-date"
                class="
                    block text-[10px] font-semibold uppercase
                    tracking-wide text-slate-500
                "
            >
                Start Date
            </label>

            <input
                id="analytics-start-date"
                type="date"
                name="start_date"
                value="{{ filters.start_date|date:'Y-m-d' }}"
                class="
                    mt-1 w-full rounded-lg
                    border border-slate-300
                    bg-white px-3 py-2
                    text-xs text-slate-900
                    focus:border-ehr-500
                    focus:outline-none
                    focus:ring-2 focus:ring-ehr-500/20
                "
            >
        </div>

        <!-- End date -->
        <div>
            <label
                for="analytics-end-date"
                class="
                    block text-[10px] font-semibold uppercase
                    tracking-wide text-slate-500
                "
            >
                End Date
            </label>

            <input
                id="analytics-end-date"
                type="date"
                name="end_date"
                value="{{ filters.end_date|date:'Y-m-d' }}"
                class="
                    mt-1 w-full rounded-lg
                    border border-slate-300
                    bg-white px-3 py-2
                    text-xs text-slate-900
                    focus:border-ehr-500
                    focus:outline-none
                    focus:ring-2 focus:ring-ehr-500/20
                "
            >
        </div>

        <!-- Encounter type -->
        <div>
            <label
                for="analytics-encounter-type"
                class="
                    block text-[10px] font-semibold uppercase
                    tracking-wide text-slate-500
                "
            >
                Encounter Type
            </label>

            <select
                id="analytics-encounter-type"
                name="encounter_type"
                class="
                    mt-1 w-full rounded-lg
                    border border-slate-300
                    bg-white px-3 py-2
                    text-xs text-slate-900
                    focus:border-ehr-500
                    focus:outline-none
                    focus:ring-2 focus:ring-ehr-500/20
                "
            >
                <option value="">All encounter types</option>

                {% for value, label in encounter_type_choices %}
                    <option
                        value="{{ value }}"
                        {% if filters.encounter_type == value %}
                            selected
                        {% endif %}
                    >
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Status -->
        <div>
            <label
                for="analytics-status"
                class="
                    block text-[10px] font-semibold uppercase
                    tracking-wide text-slate-500
                "
            >
                Status
            </label>

            <select
                id="analytics-status"
                name="status"
                class="
                    mt-1 w-full rounded-lg
                    border border-slate-300
                    bg-white px-3 py-2
                    text-xs text-slate-900
                    focus:border-ehr-500
                    focus:outline-none
                    focus:ring-2 focus:ring-ehr-500/20
                "
            >
                <option value="">All statuses</option>

                {% for value, label in encounter_status_choices %}
                    <option
                        value="{{ value }}"
                        {% if filters.status == value %}
                            selected
                        {% endif %}
                    >
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Actions -->
        <div class="flex items-end gap-2">
            <button
                type="submit"
                class="
                    inline-flex flex-1 items-center
                    justify-center rounded-lg
                    bg-ehr-700 px-3 py-2
                    text-xs font-semibold text-white
                    transition hover:bg-ehr-800
                "
            >
                Apply
            </button>

            <a
                href="{{ request.path }}"
                hx-get="{{ request.path }}"
                hx-target="#analytics-workspace"
                hx-swap="innerHTML"
                hx-push-url="true"
                hx-indicator="#analytics-loading-indicator"
                class="
                    inline-flex items-center justify-center
                    rounded-lg border border-slate-300
                    bg-white px-3 py-2
                    text-xs font-semibold text-slate-700
                    transition hover:bg-slate-50
                "
            >
                Reset
            </a>
        </div>
    </div>
</form>
