<div id="alert-results" class="divide-y rounded-lg border bg-white">{% for alert in alerts %}<a href="{% url 'decision_support:alert-detail' alert.pk %}" class="grid gap-2 px-3 py-2 hover:bg-slate-50 sm:grid-cols-[1fr_9rem_7rem]"><div><p class="text-[11px] font-bold">{{ alert.title }}</p><p class="text-[9px] text-slate-500">{{ alert.patient.display_name }} · {{ alert.message|truncatechars:120 }}</p></div><span class="font-semibold {% if alert.rule.severity == 'critical' %}text-red-700{% elif alert.rule.severity == 'high' %}text-amber-700{% endif %}">{{ alert.rule.get_severity_display }}</span><span>{{ alert.get_status_display }}</span></a>{% empty %}<p class="p-5 text-center text-xs text-slate-500">No alerts match this view.</p>{% endfor %}</div>
