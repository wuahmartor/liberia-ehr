{% extends "decision_support/base_workspace.html" %}{% block title %}Rule Editor{% endblock %}{% block cds_content %}<form method="post" class="grid gap-3 rounded-lg border bg-white p-3 sm:grid-cols-2">{% csrf_token %}{% for field in form %}<label class="block {% if field.name == 'description' or field.name == 'recommendation' or field.name == 'trigger_definition' %}sm:col-span-2{% endif %}"><span class="mb-1 block text-[10px] font-bold">{{ field.label }}</span>{{ field }}{% for error in field.errors %}<span class="text-red-600">{{ error }}</span>{% endfor %}</label>{% endfor %}<button class="rounded bg-emerald-700 px-3 py-2 text-xs font-bold text-white sm:col-span-2">Save versioned rule</button></form>{% endblock %}
