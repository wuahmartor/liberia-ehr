{% extends "layouts/app_shell.html" %}

{% block workspace %}
<section class="mx-auto max-w-5xl">
    <div class="flex items-start justify-between gap-4">
        <div>
            <p class="text-sm font-semibold text-emerald-700">Clinical orders</p>
            <h1 class="mt-1 text-2xl font-bold text-slate-950">Medication Order</h1>
            <p class="mt-2 text-sm text-slate-600">
                {{ selected_patient.display_name }} · {{ active_encounter.encounter_number }}
            </p>
        </div>
        <a
            href="{% url 'medications:mar' encounter_id=active_encounter.pk %}"
            class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50"
        >View MAR</a>
    </div>

    <div class="mt-6 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
        <h2 class="text-base font-semibold text-slate-900">New medication order</h2>
        <p class="mt-2 text-sm text-slate-600">
            Medication order entry will be available here for this active encounter.
        </p>
    </div>
</section>
{% endblock %}
