<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Liberia EHR application sitemap</title>
  <desc id="desc">Pictorial map of sign-in, home, primary navigation, clinical, analytics, decision support, administration, and messaging workspaces.</desc>
  <defs>
    <style>.bg{fill:#f8fafc}.title{font:700 30px Arial;fill:#0f172a}.sub{font:15px Arial;fill:#475569}.h{font:700 17px Arial;fill:#fff}.t{font:14px Arial;fill:#0f172a}.s{font:12px Arial;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}.green{fill:#166534;stroke:#14532d}.blue{fill:#1d4ed8;stroke:#1e40af}.purple{fill:#6d28d9;stroke:#5b21b6}.amber{fill:#b45309;stroke:#92400e}.teal{fill:#0f766e;stroke:#115e59}.line{stroke:#94a3b8;stroke-width:2;fill:none}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text class="title" x="50" y="55">Liberia EHR — application and web sitemap</text>
  <text class="sub" x="50" y="82">Solid lines are user navigation; dashed lines require a selected patient or encounter.</text>
  <rect class="box" x="50" y="120" width="180" height="70"/><text class="t" x="140" y="148" text-anchor="middle">Sign in</text><text class="s" x="140" y="172" text-anchor="middle">/accounts/login/</text>
  <rect class="green" x="300" y="120" width="200" height="70" rx="14"/><text class="h" x="400" y="150" text-anchor="middle">Home dashboard</text><text class="h" x="400" y="174" text-anchor="middle">/</text>
  <path class="line" marker-end="url(#a)" d="M230 155H300"/>
  <path class="line" d="M500 155H1340M585 155V230M775 155V230M965 155V230M1155 155V230M1340 155V230"/>

  <rect class="green" x="500" y="230" width="170" height="58" rx="12"/><text class="h" x="585" y="265" text-anchor="middle">Clinical</text>
  <rect class="blue" x="690" y="230" width="170" height="58" rx="12"/><text class="h" x="775" y="265" text-anchor="middle">Analytics</text>
  <rect class="purple" x="880" y="230" width="170" height="58" rx="12"/><text class="h" x="965" y="265" text-anchor="middle">AI &amp; CDS</text>
  <rect class="amber" x="1070" y="230" width="170" height="58" rx="12"/><text class="h" x="1155" y="265" text-anchor="middle">Administration</text>
  <rect class="teal" x="1260" y="230" width="120" height="58" rx="12"/><text class="h" x="1320" y="265" text-anchor="middle">Messages</text>

  <rect class="box" x="465" y="330" width="240" height="250"/><text class="t" x="585" y="360" text-anchor="middle">Clinical dashboard</text><text class="t" x="585" y="393" text-anchor="middle">Patients / registration</text><text class="t" x="585" y="426" text-anchor="middle">Encounters</text><text class="t" x="585" y="459" text-anchor="middle">Pharmacy</text><line x1="490" y1="480" x2="680" y2="480" stroke="#e2e8f0"/><text class="s" x="585" y="508" text-anchor="middle">With selected patient/encounter</text><text class="t" x="585" y="536" text-anchor="middle">Nursing · Orders · MAR</text><text class="s" x="585" y="560" text-anchor="middle">Notes · Diagnoses · Vitals</text>
  <rect class="box" x="715" y="330" width="190" height="250"/><text class="t" x="810" y="360" text-anchor="middle">Dashboard</text><text class="t" x="810" y="396" text-anchor="middle">Clinical</text><text class="t" x="810" y="432" text-anchor="middle">Nursing</text><text class="t" x="810" y="468" text-anchor="middle">Operations</text><text class="t" x="810" y="504" text-anchor="middle">Quality</text><text class="t" x="810" y="540" text-anchor="middle">Population · Outcomes</text>
  <rect class="box" x="925" y="330" width="170" height="250"/><text class="t" x="1010" y="360" text-anchor="middle">Alerts</text><text class="t" x="1010" y="402" text-anchor="middle">Recommendations</text><text class="t" x="1010" y="444" text-anchor="middle">Risk scores</text><text class="t" x="1010" y="486" text-anchor="middle">Clinical summaries</text><text class="t" x="1010" y="528" text-anchor="middle">Rules</text>
  <rect class="box" x="1115" y="330" width="200" height="250"/><text class="t" x="1215" y="360" text-anchor="middle">Scheduling</text><text class="t" x="1215" y="395" text-anchor="middle">Users · Groups</text><text class="t" x="1215" y="430" text-anchor="middle">Facilities · Units</text><text class="t" x="1215" y="465" text-anchor="middle">Rooms · Beds</text><text class="t" x="1215" y="500" text-anchor="middle">Configuration</text><text class="t" x="1215" y="535" text-anchor="middle">Audit · System health</text>
  <rect class="box" x="1175" y="635" width="205" height="145"/><text class="t" x="1277" y="670" text-anchor="middle">Inbox</text><text class="t" x="1277" y="706" text-anchor="middle">Compose</text><text class="t" x="1277" y="742" text-anchor="middle">Conversation / replies</text><text class="s" x="1277" y="766" text-anchor="middle">Unread + thread polling</text>
  <path class="line" marker-end="url(#a)" d="M585 288V330M775 288V330M965 288V330M1155 288V330M1320 288V620Q1320 635 1305 635"/>

  <rect class="box" x="50" y="650" width="990" height="170"/><text class="t" x="75" y="682">Patient and encounter context</text>
  <rect class="green" x="80" y="712" width="150" height="55" rx="10"/><text class="h" x="155" y="745" text-anchor="middle">Select patient</text>
  <rect class="box" x="290" y="700" width="205" height="80"/><text class="t" x="392" y="733" text-anchor="middle">Patient chart</text><text class="s" x="392" y="757" text-anchor="middle">longitudinal record</text>
  <rect class="box" x="555" y="700" width="205" height="80"/><text class="t" x="657" y="733" text-anchor="middle">Open encounter</text><text class="s" x="657" y="757" text-anchor="middle">episode of care</text>
  <rect class="box" x="820" y="690" width="185" height="100"/><text class="t" x="912" y="720" text-anchor="middle">Nursing · Orders</text><text class="t" x="912" y="747" text-anchor="middle">MAR · Vitals</text><text class="s" x="912" y="772" text-anchor="middle">clinical documentation</text>
  <path class="dash" marker-end="url(#a)" d="M230 739H290M495 739H555M760 739H820"/>
  <text class="s" x="50" y="865">Primary routes: /clinical/ · /patients/ · /encounters/ · /pharmacy/ · /analytics/ · /ai-cds/ · /administration/ · /secure-chat/</text>
</svg>
