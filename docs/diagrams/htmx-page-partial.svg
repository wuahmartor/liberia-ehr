<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650" role="img" aria-labelledby="title desc">
  <title id="title">HTMX full-page and partial rendering</title><desc id="desc">Decision and template hierarchy for normal and HTMX requests.</desc>
  <defs><style>.bg{fill:#f8fafc}.title{font:700 28px Arial;fill:#0f172a}.h{font:700 15px Arial;fill:#fff}.t{font:14px Arial;fill:#0f172a}.s{font:12px Arial;fill:#475569}.g{fill:#166534}.b{fill:#1d4ed8}.p{fill:#6d28d9}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.line{stroke:#64748b;stroke-width:3;fill:none}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1300" height="650"/><text class="title" x="45" y="52">HTMX rendering contract — full page and partial share one workflow</text>
  <rect class="g" x="60" y="125" width="190" height="70" rx="14"/><text class="h" x="155" y="155" text-anchor="middle">Authenticated</text><text class="h" x="155" y="177" text-anchor="middle">request</text>
  <polygon class="p" points="380,100 490,160 380,220 270,160"/><text class="h" x="380" y="155" text-anchor="middle">HX-Request</text><text class="h" x="380" y="177" text-anchor="middle">true?</text>
  <path class="line" marker-end="url(#m)" d="M250 160H270"/>
  <text class="t" x="520" y="118">No — normal navigation</text><path class="line" marker-end="url(#m)" d="M490 145H620"/>
  <text class="t" x="520" y="260">Yes — targeted update</text><path class="line" marker-end="url(#m)" d="M430 205Q490 285 620 285"/>
  <rect class="b" x="620" y="95" width="235" height="80" rx="14"/><text class="h" x="737" y="128" text-anchor="middle">Full page template</text><text class="h" x="737" y="151" text-anchor="middle">application chrome included</text>
  <rect class="g" x="620" y="245" width="235" height="80" rx="14"/><text class="h" x="737" y="278" text-anchor="middle">Content partial</text><text class="h" x="737" y="301" text-anchor="middle">target region only</text>
  <rect class="box" x="945" y="80" width="285" height="220" rx="14"/><text class="t" x="1087" y="112" text-anchor="middle">Template hierarchy</text><rect class="b" x="985" y="130" width="205" height="38" rx="8"/><text class="h" x="1087" y="155" text-anchor="middle">base.html</text><rect class="p" x="985" y="182" width="205" height="38" rx="8"/><text class="h" x="1087" y="207" text-anchor="middle">app_shell.html</text><rect class="g" x="985" y="234" width="205" height="38" rx="8"/><text class="h" x="1087" y="259" text-anchor="middle">included content partial</text>
  <path class="line" marker-end="url(#m)" d="M855 135H945M855 285H945"/>
  <rect class="box" x="60" y="390" width="1170" height="190" rx="15"/><text class="t" x="90" y="425">Shared server responsibilities in both modes</text>
  <g class="g"><rect x="90" y="455" width="165" height="55" rx="10"/><rect x="280" y="455" width="165" height="55" rx="10"/><rect x="470" y="455" width="165" height="55" rx="10"/><rect x="660" y="455" width="165" height="55" rx="10"/><rect x="850" y="455" width="165" height="55" rx="10"/><rect x="1040" y="455" width="160" height="55" rx="10"/></g>
  <g class="h" text-anchor="middle"><text x="172" y="488">Authentication</text><text x="362" y="488">Authorization</text><text x="552" y="488">CSRF</text><text x="742" y="488">Validation</text><text x="932" y="488">Transactions</text><text x="1120" y="488">Audit context</text></g>
  <text class="s" x="90" y="548">Vary: HX-Request prevents caches from mixing representations. Partials never weaken permissions and must not duplicate the application shell.</text>
</svg>
