<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Liberia EHR application dependencies</title><desc id="desc">Layered modular-monolith diagram showing experience, clinical workflow, foundational records, and platform applications.</desc>
  <defs><style>.bg{fill:#f8fafc}.title{font:700 28px Arial;fill:#0f172a}.label{font:700 16px Arial;fill:#334155}.h{font:700 14px Arial;fill:#fff}.s{font:12px Arial;fill:#475569}.x{fill:#1d4ed8}.w{fill:#166534}.r{fill:#0f766e}.p{fill:#64748b}.line{stroke:#94a3b8;stroke-width:2;fill:none}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1400" height="780"/><text class="title" x="45" y="52">Application dependencies — modular monolith</text><text class="s" x="45" y="78">Arrows point from consumer layers toward the records and services they depend on.</text>
  <text class="label" x="45" y="125">Experience and aggregation</text>
  <g class="x"><rect x="260" y="98" width="190" height="55" rx="12"/><rect x="480" y="98" width="190" height="55" rx="12"/><rect x="700" y="98" width="190" height="55" rx="12"/></g>
  <text class="h" x="355" y="132" text-anchor="middle">core dashboard</text><text class="h" x="575" y="132" text-anchor="middle">analytics</text><text class="h" x="795" y="132" text-anchor="middle">administration</text>
  <text class="label" x="45" y="238">Clinical workflows</text>
  <g class="w"><rect x="180" y="205" width="150" height="52" rx="11"/><rect x="350" y="205" width="150" height="52" rx="11"/><rect x="520" y="205" width="150" height="52" rx="11"/><rect x="690" y="205" width="150" height="52" rx="11"/><rect x="860" y="205" width="150" height="52" rx="11"/><rect x="1030" y="205" width="150" height="52" rx="11"/>
  <rect x="180" y="285" width="150" height="52" rx="11"/><rect x="350" y="285" width="150" height="52" rx="11"/><rect x="520" y="285" width="150" height="52" rx="11"/><rect x="690" y="285" width="150" height="52" rx="11"/><rect x="860" y="285" width="150" height="52" rx="11"/></g>
  <g class="h" text-anchor="middle"><text x="255" y="237">encounters</text><text x="425" y="237">nursing</text><text x="595" y="237">vitals</text><text x="765" y="237">diagnoses</text><text x="935" y="237">clinical_notes</text><text x="1105" y="237">decision_support</text><text x="255" y="317">orders</text><text x="425" y="317">pharmacy</text><text x="595" y="317">medications / MAR</text><text x="765" y="317">messaging</text><text x="935" y="317">scheduling</text></g>
  <text class="label" x="45" y="450">Foundational records</text>
  <g class="r"><rect x="300" y="415" width="220" height="62" rx="13"/><rect x="590" y="415" width="220" height="62" rx="13"/><rect x="880" y="415" width="220" height="62" rx="13"/></g>
  <g class="h" text-anchor="middle"><text x="410" y="452">accounts / staff identity</text><text x="700" y="452">facilities / locations</text><text x="990" y="452">patients / longitudinal chart</text></g>
  <path class="line" marker-end="url(#m)" d="M575 153V185M355 153V185M795 153V185"/><path class="line" marker-end="url(#m)" d="M425 337V400Q425 415 410 415M700 337V415M935 337V395Q935 415 990 415"/>
  <path class="line" marker-end="url(#m)" d="M255 257V380Q255 446 300 446M255 257V370Q255 446 880 446M595 257V385Q595 446 880 446M765 257V390Q765 446 880 446M765 337V395Q765 446 880 446"/>
  <text class="label" x="45" y="590">Platform and incomplete boundaries</text>
  <g class="p"><rect x="170" y="555" width="145" height="50" rx="10"/><rect x="335" y="555" width="145" height="50" rx="10"/><rect x="500" y="555" width="145" height="50" rx="10"/><rect x="665" y="555" width="145" height="50" rx="10"/><rect x="830" y="555" width="145" height="50" rx="10"/><rect x="995" y="555" width="145" height="50" rx="10"/></g>
  <g class="h" text-anchor="middle"><text x="242" y="586">audit</text><text x="407" y="586">notifications</text><text x="572" y="586">documents</text><text x="737" y="586">flowsheets</text><text x="902" y="586">laboratory / imaging</text><text x="1067" y="586">care / AI shells</text></g>
  <rect x="170" y="655" width="970" height="70" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text class="label" x="200" y="683">Ownership rule</text><text class="s" x="200" y="708">The owning app controls lifecycle; cross-app dashboards read data; foreign keys establish integrity but never grant user authorization.</text>
</svg>
