<article class="rounded-xl border border-slate-200 bg-white p-4 shadow-panel">
    <div class="flex gap-3">
        <div class="mt-0.5 text-xl {{ icon_class }}">
            {{ icon }}
        </div>
        <div class="min-w-0">
            <h3 class="font-semibold text-slate-900">{{ title }}</h3>
            <p class="mt-1 text-sm leading-6 text-slate-600">
                {{ message }}
            </p>
            {% if action_label %}
                <button
                    type="button"
                    class="mt-3 rounded-md border border-blue-500 px-3 py-1.5 text-sm font-semibold text-blue-700 hover:bg-blue-50"
                >
                    {{ action_label }}
                </button>
            {% endif %}
        </div>
    </div>
</article>
